<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
			rel="stylesheet" />
		<link rel="stylesheet" href="./style.css" />
		<title>Profile</title>
	</head>
	<body>
		<main class="profile">
			<div class="container">
				<section class="photo-section">
					<img
						src="./img/profile-photo.jpg"
						width="88"
						height="88"
						alt="Profile Photo"
						class="profile-photo" />
				</section>
				<section class="info-section">
					<h1 class="name-title">Jessica Randall</h1>
					<p class="location">London, United Kingdom</p>
				</section>
				<section class="job-section">
					<p class="job-information">"Front-end developer and avid reader."</p>
				</section>
				<section class="links-section">
					<a
						href="https://github.com/antongorelkin/antongorelkin"
						class="link-item">
						GitHub
					</a>
					<a
						href="https://www.frontendmentor.io/profile/antongorelkin"
						class="link-item">
						Frontend Mentor
					</a>
					<a href="#" class="link-item"> LinkedIn </a>
					<a href="#" class="link-item"> Twitter </a>
					<a href="#" class="link-item"> Instagram </a>
				</section>
			</div>
		</main>
	</body>
</html>
